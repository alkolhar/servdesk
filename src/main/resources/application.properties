spring.application.name=servdesk

# Flyway migrations are the only source of schema truth; Hibernate only ever validates its
# mappings against what Flyway already created, it never generates or alters schema itself.
spring.jpa.hibernate.ddl-auto=validate

# The JPA session must not outlive the service-layer transaction. Assemblers only ever call
# getId() on lazy associations (safe without an open session, since a Hibernate proxy's id is
# already known), so nothing in this codebase actually relies on open-in-view.
spring.jpa.open-in-view=false

# Without this, Boot's own MethodArgumentNotValidException handling (and any other
# ErrorResponse-implementing exception) falls back to the classic timestamp/error/trace body
# instead of RFC 7807 ProblemDetail, contradicting the documented error-response contract.
spring.mvc.problemdetails.enabled=true

# Browser sessions (ADR-0005). In memory — a restart logs everyone out, accepted for now. The idle
# timeout is a configurable default. HttpOnly is the container default; SameSite=Strict because the
# SPA is same-origin. Secure is a deployment setting: set server.servlet.session.cookie.secure=true
# wherever servdesk is served over HTTPS (plain-HTTP localhost development needs it off).
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Flowable, the ticket lifecycle engine (ADR-0004, ADR-0006, ADR-0007). It owns its own act_*/flw_*
# tables and creates/upgrades them at startup; servdesk's Flyway migrations never touch them, and
# there are no foreign keys either way (the link is the process business key = the Ticket id).
flowable.database-schema-update=true
# identity stays with Person and Spring Security: no IDM engine, no act_id_* tables
flowable.idm.enabled=false
# operations/debugging history, not the product's audit trail (ADR-0006)
flowable.history-level=audit
# no async work yet: every process step runs synchronously in its caller's transaction. The
# auto-close timer (#116) is what turns the async executor on.
flowable.async-executor-activate=false
