  /api/attribute-definitions:
    parameters:
      - $ref: "#/components/parameters/ApiVersionHeader"
    get:
      tags: [attribute-definitions]
      summary: >
        List custom-field definitions, optionally scoped to one target aggregate. Not paginated —
        the definition set is per-deployment admin configuration, and consumers (admin UI, form
        rendering) always want the whole set.
      parameters:
        - name: target
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AttributeTarget"
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "200":
          description: The definitions.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/AttributeDefinitionCollection"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [attribute-definitions]
      summary: >
        Declare a custom-field definition. Agent-only. `key` must be a machine name
        ([a-z][a-z0-9_]*) and is unique per target; `enumValues` is required for ENUM and
        forbidden otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeDefinitionCreateRequest"
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "201":
          description: Definition created.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/AttributeDefinitionModel"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
  /api/attribute-definitions/{id}:
    parameters:
      - $ref: "#/components/parameters/ApiVersionHeader"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [attribute-definitions]
      summary: Fetch a definition by id.
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "200":
          description: The definition.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/AttributeDefinitionModel"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
    put:
      tags: [attribute-definitions]
      summary: >
        Update a definition's label/required/enumValues. Agent-only. `target`, `key`, and `type`
        are immutable after creation — changing them would silently invalidate values already
        stored on tickets — so the update body cannot carry them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeDefinitionUpdateRequest"
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "200":
          description: The updated definition.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/AttributeDefinitionModel"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
    delete:
      tags: [attribute-definitions]
      summary: >
        Soft-delete a definition. Agent-only. Values already stored on tickets stay in place; the
        key just stops being accepted on subsequent writes (validation is write-time only).
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
  /api/tickets:
    parameters:
      - $ref: "#/components/parameters/ApiVersionHeader"
    get:
      tags: [tickets]
      summary: >
        List tickets across all four subtypes in one paginated stream (read-only — creating,
        updating, and deleting stay on each subtype's own endpoint). Each item carries its `type`
        discriminator and display number plus a link to the full subtype resource. A Customer
        caller only ever sees tickets they requested.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TicketStatus"
        - name: requesterId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: assigneeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: teamId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: priorityId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: attrKey
          in: query
          required: false
          description: Custom-field key to filter by; requires attrValue (400 without it).
          schema:
            type: string
        - name: attrValue
          in: query
          required: false
          description: Text form of the custom-field value to match (jsonb `->>` semantics).
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "200":
          description: A page of tickets across all subtypes.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/TicketPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/tickets/{id}:
    parameters:
      - $ref: "#/components/parameters/ApiVersionHeader"
      - name: id
        in: path
        required: true
        description: The shared Ticket id (ADR-0001) — same value as the subtype's own `id`.
        schema:
          type: integer
          format: int64
    get:
      tags: [tickets]
      summary: >
        Fetch a ticket by its shared id, regardless of subtype. Answers 404 for a Customer caller
        who is not the ticket's requester — indistinguishable from a missing id.
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "200":
          description: The ticket.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/TicketModel"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
  /api/tickets/{ticketId}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ApiVersionHeader"
      - name: ticketId
        in: path
        required: true
        description: The shared Ticket id (ADR-0001) — same value as any subtype's own `id`.
        schema:
          type: integer
          format: int64
      - name: action
        in: path
        required: true
        description: >
          An action of the ticket's current stage. The Incident lifecycle's: start-work, put-on-hold,
          resume, resolve, close, reopen, cancel.
        schema:
          type: string
          enum: [start-work, put-on-hold, resume, resolve, close, reopen, cancel]
    post:
      tags: [actions]
      summary: Perform an action on a ticket's current lifecycle stage. Agent-only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "204":
          description: Done; reload the ticket to see where the process took it.
        "400":
          description: The action requires a comment (resolve, cancel) and none was given, or the body is malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "409":
          description: >
            The action isn't available on this ticket now — its current stage doesn't offer it, its
            process has ended (closed), or someone else moved it on a moment earlier.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/tickets/{ticketId}/comments:
    parameters:
      - $ref: "#/components/parameters/ApiVersionHeader"
      - name: ticketId
        in: path
        required: true
        description: The shared Ticket id (ADR-0001) — same value as any subtype's own `id`.
        schema:
          type: integer
          format: int64
    get:
      tags: [comments]
      summary: >
        List a ticket's comments in one combined, chronological stream. A Customer caller only ever
        sees non-internal comments; an Agent sees both.
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "200":
          description: The ticket's comments.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/CommentCollection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
    post:
      tags: [comments]
      summary: >
        Add a comment to a ticket. `internal=true` is rejected (403) unless the caller is an Agent —
        "internal" means "hidden from the requester," which a Customer can't set on their own comment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateRequest"
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "201":
          description: Comment created.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/CommentModel"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: >
        Set by POST /api/login. Writes authenticated this way also need the X-XSRF-TOKEN header
        (the XSRF-TOKEN cookie's value).
  parameters:
    ApiVersionHeader:
      name: X-API-Version
      in: header
      required: false
      description: Defaults to "1" if omitted (see ApiVersioningConfig).
      schema:
        type: string
        default: "1"
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
    SortParam:
      name: sort
      in: query
      required: false
      description: 'e.g. "name,asc" — repeatable for multi-field sort.'
      schema:
        type: string
  responses:
    Unauthorized:
      description: >
        Missing or invalid credentials. Never carries a WWW-Authenticate: Basic challenge, so a
        browser doesn't pop its native login dialog over the SPA.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ValidationProblem:
      description: >
        Request body failed validation — Jakarta Bean Validation or a custom-field rule. `errors` names
        each refused field.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFoundProblem:
      description: No resource with that id.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ForbiddenProblem:
      description: >
        The caller is authenticated but not allowed to perform this action — either a static
        URL+role rule (e.g. Customer attempting an Agent-only write) or a data-dependent one (e.g. a
        Customer's comment requesting internal=true) — or a session-authenticated write arrived
        without its X-XSRF-TOKEN header.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    DefaultProblem:
      description: >
        Any other error not called out explicitly above for this operation — e.g. an unsupported
        X-API-Version header (400, ApiVersioningConfig), missing/invalid credentials (401) or a
        session-authenticated write without its CSRF token (403) on an endpoint where that wasn't
        already listed. Always RFC 7807 ProblemDetail.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ConflictProblem:
      description: >
        A DB-level constraint was violated — a referenced id (e.g. teamId, categoryId, requesterId,
        parentId, relatedProblemId) doesn't exist, or a unique column (e.g. a soft-deleted row's still
        -occupied email/username/name) collides. Surfaces as DataIntegrityViolationException, mapped
        to 409 by RestExceptionHandler rather than a domain-level exception, since the service layer
        never sees this coming.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
  schemas:
    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details, as produced by common.web.RestExceptionHandler.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          description: >
            On a field-level 400 only: which request fields were refused and why, so a form can show
            each next to its field. Bean Validation failures (code = the constraint, e.g. NotBlank,
            Email, PasswordPolicy) and custom-field rejections (field `attributes.<key>`, code
            unknown/required/type/not_allowed) share this shape.
          items:
            $ref: "#/components/schemas/FieldProblem"
    FieldProblem:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: The field's path in the request body, e.g. `subject` or `attributes.costCentre`.
        code:
          type: string
          description: Stable, for clients to translate.
        message:
          type: string
          nullable: true
          description: English, for humans reading the raw response.
    PersonRole:
      type: string
      enum: [AGENT, CUSTOMER]
    PersonModel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        role:
          $ref: "#/components/schemas/PersonRole"
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        enabled:
          type: boolean
        teamId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
        _links:
          type: object
          description: HATEOAS links (self).
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          pattern: '\S'
        password:
          type: string
          minLength: 1
          pattern: '\S'
    MeModel:
      type: object
      description: >
        The logged-in person. Its own shape rather than PersonModel: open to every authenticated
        caller, where PersonModel's self link points into the Agent-only person directory.
      properties:
        id:
          type: integer
          format: int64
        role:
          $ref: "#/components/schemas/PersonRole"
        name:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
          nullable: true
        _links:
          type: object
          description: HATEOAS links (self).
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          pattern: '\S'
          format: password
          description: Only compared, never held to the policy — an older, shorter password can still be changed.
        newPassword:
          type: string
          minLength: 12
          maxLength: 72
          format: password
          description: The password policy — 12 to 72 characters, no composition rules.
    TicketTaskModel:
      type: object
      description: >
        One open lifecycle task (ADR-0008). `key` is the stage's stable task key (triage, work,
        on-hold, confirm-resolution, ...), for display; Flowable's own task ids never appear.
      properties:
        key:
          type: string
        assigneeId:
          type: integer
          format: int64
          nullable: true
        teamId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
        _links:
          type: object
          description: The `action:<name>` links this caller may use on this task now.
    ActionRequest:
      type: object
      properties:
        comment:
          type: string
          nullable: true
          description: >
            Saved as an ordinary (non-internal) comment by the caller. Required for resolve (the
            resolution note) and cancel (why it's closed without being fixed).
    PersonCreateRequest:
      type: object
      required: [role, name, email]
      properties:
        role:
          $ref: "#/components/schemas/PersonRole"
        name:
          type: string
          minLength: 1
          pattern: '\S'
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
          minLength: 12
          maxLength: 72
          description: The password policy — 12 to 72 characters, no composition rules.
        teamId:
          type: integer
          format: int64
          nullable: true
    PersonUpdateRequest:
      type: object
      required: [role, name, email]
      description: >-
        Every field replaces the stored value except the two that carry a
        login (username, enabled), where null means "leave unchanged".
        Omitting one must never revoke a login, so neither can be cleared
        through this endpoint. No password: a person changes their own with
        PUT /api/me/password.
      properties:
        role:
          $ref: "#/components/schemas/PersonRole"
        name:
          type: string
          minLength: 1
          pattern: '\S'
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
          description: Null leaves the existing username unchanged.
        enabled:
          type: boolean
          nullable: true
          description: Null leaves the existing enabled flag unchanged.
        teamId:
          type: integer
          format: int64
          nullable: true
    PersonPage:
      type: object
      description: Spring HATEOAS PagedModel<PersonModel>.
      properties:
        _embedded:
          type: object
          properties:
            personModelList:
              type: array
              items:
                $ref: "#/components/schemas/PersonModel"
        _links:
          type: object
          description: first/prev/self/next/last, as available.
        page:
          $ref: "#/components/schemas/PageMetadata"
    CategoryModel:
      type: object
      description: A hierarchical, self-referencing ticket classification (e.g. Hardware -> Laptop -> Battery).
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        parentId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
        _links:
          type: object
          description: HATEOAS links (self, and parent when parentId is present).
    CategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '\S'
        parentId:
          type: integer
          format: int64
          nullable: true
    CategoryUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '\S'
        parentId:
          type: integer
          format: int64
          nullable: true
    CategoryPage:
      type: object
      description: Spring HATEOAS PagedModel<CategoryModel>.
      properties:
        _embedded:
          type: object
          properties:
            categoryModelList:
              type: array
              items:
                $ref: "#/components/schemas/CategoryModel"
        _links:
          type: object
          description: first/prev/self/next/last, as available.
        page:
          $ref: "#/components/schemas/PageMetadata"
    PriorityModel:
      type: object
      description: >
        A flat ranking a ticket can be given (lower sortOrder = more severe). No longer
        directly settable on a ticket — derived server-side from its Impact/Urgency pair via
        PriorityDefinition; this classification entity itself is still directly creatable/
        editable, since PriorityDefinition rows reference it.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
        _links:
          type: object
          description: HATEOAS links (self).
    PriorityCreateRequest:
      type: object
      required: [name, sortOrder]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '\S'
        sortOrder:
          type: integer
    PriorityUpdateRequest:
      type: object
      required: [name, sortOrder]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '\S'
        sortOrder:
          type: integer
    PriorityPage:
      type: object
      description: Spring HATEOAS PagedModel<PriorityModel>.
      properties:
        _embedded:
          type: object
          properties:
            priorityModelList:
              type: array
              items:
                $ref: "#/components/schemas/PriorityModel"
        _links:
          type: object
          description: first/prev/self/next/last, as available.
        page:
          $ref: "#/components/schemas/PageMetadata"
    ImpactModel:
      type: object
      description: >
        One axis of the Impact x Urgency priority matrix (lower sortOrder = more severe) —
        how broadly a ticket's underlying issue affects the business.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
        _links:
          type: object
          description: HATEOAS links (self).
    ImpactCreateRequest:
      type: object
      required: [name, sortOrder]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '\S'
        sortOrder:
          type: integer
    ImpactUpdateRequest:
      type: object
      required: [name, sortOrder]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '\S'
        sortOrder:
          type: integer
    ImpactPage:
      type: object
      description: Spring HATEOAS PagedModel<ImpactModel>.
      properties:
        _embedded:
          type: object
          properties:
            impactModelList:
              type: array
              items:
                $ref: "#/components/schemas/ImpactModel"
        _links:
          type: object
          description: first/prev/self/next/last, as available.
        page:
          $ref: "#/components/schemas/PageMetadata"
    UrgencyModel:
      type: object
      description: >
        The other axis of the Impact x Urgency priority matrix (lower sortOrder = more
        severe) — how quickly a ticket's underlying issue needs addressing.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
        _links:
          type: object
          description: HATEOAS links (self).
    UrgencyCreateRequest:
      type: object
      required: [name, sortOrder]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '\S'
        sortOrder:
          type: integer
    UrgencyUpdateRequest:
      type: object
      required: [name, sortOrder]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '\S'
        sortOrder:
          type: integer
    UrgencyPage:
      type: object
      description: Spring HATEOAS PagedModel<UrgencyModel>.
      properties:
        _embedded:
          type: object
          properties:
            urgencyModelList:
              type: array
              items:
                $ref: "#/components/schemas/UrgencyModel"
        _links:
          type: object
          description: first/prev/self/next/last, as available.
        page:
          $ref: "#/components/schemas/PageMetadata"
    PriorityDefinitionModel:
      type: object
      description: >
        One cell of the Impact x Urgency priority matrix: maps a single (impact, urgency)
        pair to the Priority a ticket carrying that pair should be given.
      properties:
        id:
          type: integer
          format: int64
        impactId:
          type: integer
          format: int64
        urgencyId:
          type: integer
          format: int64
        priorityId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
        _links:
          type: object
          description: HATEOAS links (self, impact, urgency, priority).
    PriorityDefinitionCreateRequest:
      type: object
      required: [impactId, urgencyId, priorityId]
      properties:
        impactId:
          type: integer
          format: int64
        urgencyId:
          type: integer
          format: int64
        priorityId:
          type: integer
          format: int64
    PriorityDefinitionUpdateRequest:
      type: object
      required: [impactId, urgencyId, priorityId]
      properties:
        impactId:
          type: integer
          format: int64
        urgencyId:
          type: integer
          format: int64
        priorityId:
          type: integer
          format: int64
    PriorityDefinitionPage:
      type: object
      description: Spring HATEOAS PagedModel<PriorityDefinitionModel>.
      properties:
        _embedded:
          type: object
          properties:
            priorityDefinitionModelList:
              type: array
              items:
                $ref: "#/components/schemas/PriorityDefinitionModel"
        _links:
          type: object
          description: first/prev/self/next/last, as available.
        page:
          $ref: "#/components/schemas/PageMetadata"
    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, PENDING, RESOLVED, CLOSED]
    SlaPolicyModel:
      type: object
      description: Response/resolution targets for tickets of one Priority.
      properties:
        id:
          type: integer
          format: int64
        priorityId:
          type: integer
          format: int64
        responseMinutes:
          type: integer
          nullable: true
          description: Minutes from ticket creation to the response deadline; null = no target.
        resolutionMinutes:
          type: integer
          nullable: true
          description: Minutes from ticket creation to the resolution deadline; null = no target.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
        _links:
          type: object
          description: HATEOAS links (self).
    SlaPolicyCreateRequest:
      type: object
      required: [priorityId]
      description: At least one of responseMinutes/resolutionMinutes must be present.
      properties:
        priorityId:
          type: integer
          format: int64
        responseMinutes:
          type: integer
          minimum: 1
          nullable: true
        resolutionMinutes:
          type: integer
          minimum: 1
          nullable: true
    SlaPolicyUpdateRequest:
      type: object
      description: >
        The governed priority is fixed at creation and cannot appear here. At least one of
        responseMinutes/resolutionMinutes must be present.
      properties:
        responseMinutes:
          type: integer
          minimum: 1
          nullable: true
        resolutionMinutes:
          type: integer
          minimum: 1
          nullable: true
    SlaPolicyCollection:
      type: object
      description: Spring HATEOAS CollectionModel<SlaPolicyModel> — not paginated.
      properties:
        _embedded:
          type: object
          properties:
            slaPolicyModelList:
              type: array
              items:
                $ref: "#/components/schemas/SlaPolicyModel"
        _links:
          type: object
          description: self.
    AttributeTarget:
      type: string
      description: Which aggregate a custom-field definition applies to.
      enum: [TICKET]
    AttributeType:
      type: string
      description: >
        The value type a definition demands. DATE is an ISO-8601 calendar date string
        (yyyy-MM-dd); ENUM restricts the value to the definition's enumValues.
      enum: [STRING, NUMBER, BOOLEAN, DATE, ENUM]
    AttributeDefinitionModel:
      type: object
      description: An admin-editable declaration of a custom-field key a target aggregate accepts.
      properties:
        id:
          type: integer
          format: int64
        target:
          $ref: "#/components/schemas/AttributeTarget"
        key:
          type: string
          example: cost_center
        label:
          type: string
        type:
          $ref: "#/components/schemas/AttributeType"
        required:
          type: boolean
        enumValues:
          type: array
          items:
            type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
        _links:
          type: object
          description: HATEOAS links (self).
    AttributeDefinitionCreateRequest:
      type: object
      required: [target, key, label, type]
      properties:
        target:
          $ref: "#/components/schemas/AttributeTarget"
        key:
          type: string
          pattern: "[a-z][a-z0-9_]*"
        label:
          type: string
          minLength: 1
          pattern: '\S'
        type:
          $ref: "#/components/schemas/AttributeType"
        required:
          type: boolean
        enumValues:
          type: array
          items:
            type: string
          nullable: true
    AttributeDefinitionUpdateRequest:
      type: object
      required: [label]
      description: target/key/type are immutable after creation and cannot appear here.
      properties:
        label:
          type: string
          minLength: 1
          pattern: '\S'
        required:
          type: boolean
        enumValues:
          type: array
          items:
            type: string
          nullable: true
    AttributeDefinitionCollection:
      type: object
      description: Spring HATEOAS CollectionModel<AttributeDefinitionModel> — not paginated.
      properties:
        _embedded:
          type: object
          properties:
            attributeDefinitionModelList:
              type: array
              items:
                $ref: "#/components/schemas/AttributeDefinitionModel"
        _links:
          type: object
          description: self.
    TicketType:
      type: string
      description: >
        Which subtype a ticket belongs to. A read-model discriminator only — the domain has no
        type field (ADR-0001); a subtype row's existence says what kind of ticket it is.
      enum: [INCIDENT, PROBLEM, CHANGE, SERVICE_REQUEST]
    TicketModel:
      type: object
      description: >
        Cross-subtype read model of a ticket (issue #30): the shared Ticket fields plus the `type`
        discriminator and the subtype's display number. Carries no subtype-specific field — those
        live on the subtype's own resource, linked under the type-named relation
        (`incident`/`problem`/`change`/`serviceRequest`).
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/TicketType"
        displayNumber:
          type: string
          example: INC-001000
        status:
          $ref: "#/components/schemas/TicketStatus"
        subject:
          type: string
        attributes:
          type: object
          additionalProperties: true
          description: >
            Customer-defined custom-field values, keyed by attribute definition key (see
            /api/attribute-definitions). Validated against the live definitions on every write;
            omitted/null on a request means an empty map (full replacement, PUT semantics).
        description:
          type: string
          nullable: true
        categoryId:
          type: integer
          format: int64
          nullable: true
        impactId:
          type: integer
          format: int64
          nullable: true
        urgencyId:
          type: integer
          format: int64
          nullable: true
        priorityId:
          type: integer
          format: int64
          nullable: true
        requesterId:
          type: integer
          format: int64
        assigneeId:
          type: integer
          format: int64
          nullable: true
        teamId:
          type: integer
          format: int64
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        respondBy:
          type: string
