openapi: 3.0.3
info:
  title: servdesk API
  description: >
    ITSM ticketing API. This file is the hand-authored contract (contract-first, no
    code generation in either direction) — the implementation under
    dev.alkolhar.servdesk is written to match it, not generated from it.
  version: "1"
servers:
  - url: http://localhost:8080
security:
  # either one authenticates a request (ADR-0005): HTTP Basic for scripts, CI and the contract
  # tests; the session cookie POST /api/login sets for the browser
  - basicAuth: []
  - sessionCookie: []
tags:
  - name: setup
    description: One-shot, pre-auth bootstrap of the first agent account.
  - name: session
    description: >
      Browser sessions (ADR-0005). POST /api/login sets an HttpOnly, SameSite=Strict session
      cookie; a session-authenticated write must also echo the XSRF-TOKEN cookie in an
      X-XSRF-TOKEN header, or it is refused with 403. Requests authenticated by HTTP Basic need
      no CSRF token.
  - name: persons
    description: Agents and customers.
  - name: categories
    description: Hierarchical, self-referencing ticket classification lookup data.
  - name: priorities
    description: >
      Flat ticket priority lookup data. No longer directly settable on a ticket — derived
      server-side from its Impact/Urgency pair via PriorityDefinition.
  - name: impacts
    description: One axis of the Impact x Urgency priority matrix — how broadly an issue affects the business.
  - name: urgencies
    description: The other axis of the Impact x Urgency priority matrix — how quickly an issue needs addressing.
  - name: priority-definitions
    description: >
      The Impact x Urgency priority matrix itself: maps each (impact, urgency) pair to the
      Priority a ticket carrying that pair should be given.
  - name: incidents
    description: Unplanned interruptions or reductions in quality of a service.
  - name: problems
    description: Root causes behind one or more Incidents.
  - name: changes
    description: Planned modifications to infrastructure or a service.
  - name: service-requests
    description: Routine requests for something, not a report of something broken.
  - name: tickets
    description: >
      Read-only cross-subtype ticket overview: one paginated stream over all four subtypes,
      addressed by the shared Ticket id (ADR-0001). Writes stay on each subtype's own endpoint.
  - name: sla-policies
    description: >
      Response/resolution targets per Priority — at most one policy per priority. Deadlines are
      stamped onto tickets at creation/re-prioritization; a Quartz scanner detects breaches.
  - name: attribute-definitions
    description: >
      Admin-editable custom-field definitions (which keys a target aggregate accepts, their type
      and validation facts). Values live in the target's own `attributes` map.
  - name: actions
    description: >
      Task-backed ticket actions (ADR-0008): an action completes the ticket's current lifecycle task
      with that outcome, and the process moves the ticket on. Follow a ticket model's `action:*`
      links rather than building these URLs.
  - name: comments
    description: >
      Activity/conversation entries on a ticket, nested under the shared Ticket id (ADR-0001) —
      serves all four subtypes uniformly.
paths:
  /api/setup:
    get:
      tags: [setup]
      summary: Check whether the first-run setup still needs to be completed.
      security: []
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "200":
          description: Setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      tags: [setup]
      summary: Create the first agent account. Refuses to run a second time.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "201":
          description: The first agent was created.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/PersonModel"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "409":
          description: Setup was already completed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/login:
    post:
      tags: [session]
      summary: Log in and start a browser session.
      description: >-
        Sets the session cookie and a fresh XSRF-TOKEN cookie. Unversioned, like /api/setup.
        A wrong password, an unknown username and a disabled account all answer the same 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "204":
          description: Logged in. The session cookie is in Set-Cookie.
          headers:
            Set-Cookie:
              description: JSESSIONID (HttpOnly, SameSite=Strict) and XSRF-TOKEN.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          description: Invalid username or password.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/logout:
    post:
      tags: [session]
      summary: End the browser session.
      description: >-
        Invalidates the session and expires its cookies. Answers 204 whether or not a session
        existed. With a live session cookie, the X-XSRF-TOKEN header is required (403 without it).
      security: []
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "204":
          description: Logged out.
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
  /api/me:
    parameters:
      - $ref: "#/components/parameters/ApiVersionHeader"
    get:
      tags: [session]
      summary: The logged-in person.
      description: >-
        The SPA's startup call: a 401 here sends it to its login screen. Works for a session
        and for HTTP Basic alike.
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "200":
          description: Who the caller is.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/MeModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/me/password:
    parameters:
      - $ref: "#/components/parameters/ApiVersionHeader"
    put:
      tags: [session]
      summary: Change your own password.
      description: >-
        Any logged-in person, for their own account. currentPassword must match
        (403 otherwise — not 401, the caller is authenticated). The new password
        must meet the policy: 12 to 72 characters. Other sessions stay logged in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: currentPassword is wrong (or a session write without its CSRF token).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/persons:
    parameters:
      - $ref: "#/components/parameters/ApiVersionHeader"
    get:
      tags: [persons]
      summary: List persons (paginated, optionally filtered by role).
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PersonRole"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "200":
          description: A page of persons.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/PersonPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [persons]
      summary: Create a person (agent or customer).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonCreateRequest"
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "201":
          description: Person created.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/PersonModel"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ConflictProblem"
  /api/persons/{id}:
    parameters:
      - $ref: "#/components/parameters/ApiVersionHeader"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [persons]
      summary: Fetch a person by id.
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "200":
          description: The person.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/PersonModel"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
    put:
      tags: [persons]
      summary: Replace a person's editable fields.
      description: >-
        Refuses with 409 when the change would strip the last login-capable
        Agent of that capability — demoting them to CUSTOMER or setting
        enabled = false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdateRequest"
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "200":
          description: The updated person.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/PersonModel"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
    delete:
      tags: [persons]
      summary: Soft-delete a person.
      description: >-
        Refuses with 409 when the person is the last Agent who can still log in
        (an Agent with a username, a password and enabled = true). A deployment
        that loses its last such Agent cannot be administered, and /api/setup
        will not help — it only runs while no person exists at all.
      responses:
        "default":
          $ref: "#/components/responses/DefaultProblem"
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
