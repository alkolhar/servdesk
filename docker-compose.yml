services:
  db:
    # Same image as the contract-tests job in ci.yml and TestcontainersConfiguration.POSTGRES_IMAGE —
    # keep all three in step. 17 because Flowable 8's CI covers 14-17 (ADR-0006). Bumped by hand.
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_DB: servdesk
      POSTGRES_USER: servdesk
      POSTGRES_PASSWORD: servdesk
    ports:
      - "5432:5432"
    volumes:
      - servdesk-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servdesk -d servdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/servdesk
      SPRING_DATASOURCE_USERNAME: servdesk
      SPRING_DATASOURCE_PASSWORD: servdesk
    ports:
      - "8080:8080"

volumes:
  servdesk-db-data:
