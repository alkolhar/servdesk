<main class="page" *transloco="let t">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title
        ><h1>{{ t('login.title') }}</h1></mat-card-title
      >
    </mat-card-header>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-card-content>
        <mat-form-field appearance="outline">
          <mat-label>{{ t('login.username') }}</mat-label>
          <input matInput formControlName="username" autocomplete="username" required />
          <mat-error>{{ t('login.required') }}</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>{{ t('login.password') }}</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
            required
          />
          <mat-error>{{ t('login.required') }}</mat-error>
        </mat-form-field>
        @if (error(); as key) {
          <p class="error" role="alert">{{ t(key) }}</p>
        }
      </mat-card-content>
      <mat-card-actions align="end">
        <button mat-flat-button type="submit" [disabled]="submitting()">
          {{ t('login.submit') }}
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</main>
