name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Runs compile, unit + Testcontainers/PostgreSQL integration tests, ArchUnit rules, Spotless
      # format check and JaCoCo coverage reporting (all wired into the verify phase — see pom.xml).
      # The Docker daemon Testcontainers needs is preinstalled on GitHub-hosted ubuntu runners.
      - name: Build and verify
        run: ./mvnw --batch-mode verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # Not a blocking gate yet: this is the first time SpotBugs runs against a JDK it was actually
      # built to support (the project's own machine used to author this pipeline is on a newer JDK
      # where SpotBugs's bundled ASM can't parse the platform's own class files — see pom.xml).
      # Remove continue-on-error once a real run here has been observed green.
      - name: Static analysis (SpotBugs)
        continue-on-error: true
        run: ./mvnw --batch-mode spotbugs:check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Build container image
        run: docker build -t servdesk:ci .

  # Verifies the running app never drifts from static/openapi/servdesk-api.yaml. Runs as its own CI
  # job (not part of `./mvnw verify`) using each tool's own officially-supported integration —
  # schemathesis/action for Schemathesis, and Redocly CLI via npx (Node is preinstalled on
  # GitHub-hosted ubuntu runners, same basis as Docker in build-and-test above) — rather than
  # shelling out to either from inside a JUnit test.
  contract-tests:
    runs-on: ubuntu-latest
    # Most failure surface of any job here (a backgrounded app process, a polling readiness loop, two
    # external tools) — bound it rather than falling back to the platform default.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: servdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d servdesk"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build the jar
        run: ./mvnw --batch-mode package -DskipTests

      # DIAGNOSTIC (wayfinder #58): stdout/stderr redirected to a file that outlives this step, and
      # Tomcat's access log switched on, so the run's actual request sequence can be read afterwards.
      - name: Start the app against the PostgreSQL service container
        run: |
          mkdir -p "$GITHUB_WORKSPACE/accesslog"
          java -jar target/*.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/servdesk \
            --spring.datasource.username=postgres \
            --spring.datasource.password=root \
            --server.tomcat.accesslog.enabled=true \
            --server.tomcat.accesslog.directory="$GITHUB_WORKSPACE/accesslog" \
            --server.tomcat.accesslog.prefix=access \
            --server.tomcat.accesslog.suffix=.log \
            --server.tomcat.accesslog.buffered=false \
            > "$GITHUB_WORKSPACE/app.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/setup && exit 0
            sleep 2
          done
          echo "App never became ready" >&2
          exit 1

      # Fixture-only credentials for this CI run's disposable PostgreSQL service container — not a
      # real secret, same admin/admin123 pattern the integration tests already bootstrap with.
      - name: Bootstrap the first agent
        run: |
          curl -sf -X POST http://localhost:8080/api/setup -H "Content-Type: application/json" \
            -d '{"name":"Administrator","email":"admin@example.com","username":"admin","password":"admin123"}'

      - name: Lint and bundle the OpenAPI contract (Redocly CLI)
        run: |
          npx --yes @redocly/cli@2.39.0 lint
          npx --yes @redocly/cli@2.39.0 bundle main -o /tmp/bundled-openapi.yaml

      # DIAGNOSTIC (wayfinder #58): the admin's row before the fuzzer touches anything.
      - name: Record the person table before Schemathesis
        run: |
          PGPASSWORD=root psql -h localhost -U postgres -d servdesk \
            -c "SELECT id, name, email, username, role, enabled, deleted_at FROM person ORDER BY id;" \
            | tee "$GITHUB_WORKSPACE/person-before.txt"

      # DIAGNOSTIC (wayfinder #58): continue-on-error so the probes below always run — the point of
      # this branch is the evidence after the run, not this step's verdict.
      - name: Verify the running app matches the contract (Schemathesis)
        continue-on-error: true
        uses: schemathesis/action@v3
        with:
          schema: /tmp/bundled-openapi.yaml
          base-url: http://localhost:8080
          checks: not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance
          # base64 of admin:admin123 — the fixture credentials bootstrapped above
          authorization: "Basic YWRtaW46YWRtaW4xMjM="

      # DIAGNOSTIC (wayfinder #58): the hypothesis under test is that the fuzzer soft-deletes or
      # demotes the very admin it authenticates as. Three pieces of evidence, in order of directness:
      #   1. can that credential still authenticate at all?
      #   2. what does its row look like now?
      #   3. what did the run actually send to /api/persons, and when did 401/403 start?
      - name: Probe the admin credential after Schemathesis
        if: always()
        run: |
          echo "== can the bootstrapped admin still authenticate? =="
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -u admin:admin123 \
            http://localhost:8080/api/persons)
          echo "GET /api/persons as admin -> HTTP $STATUS"
          echo "admin_auth_status=$STATUS" >> "$GITHUB_STEP_SUMMARY"

          echo "== person table after the run =="
          PGPASSWORD=root psql -h localhost -U postgres -d servdesk \
            -c "SELECT id, name, email, username, role, enabled, deleted_at FROM person ORDER BY id;" \
            | tee "$GITHUB_WORKSPACE/person-after.txt"

          echo "== every request the run made to /api/persons =="
          grep -E '"(DELETE|PUT|POST) /api/persons' "$GITHUB_WORKSPACE"/accesslog/*.log \
            | tee "$GITHUB_WORKSPACE/persons-writes.txt" || echo "(none)"

          echo "== first 401/403 in the access log, with surrounding context =="
          grep -n -E ' (401|403) ' "$GITHUB_WORKSPACE"/accesslog/*.log | head -40 || echo "(none)"

          echo "== ERROR lines in the app log =="
          grep -c 'ERROR' "$GITHUB_WORKSPACE/app.log" || echo "0"

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: contract-tests-diagnostics
          path: |
            app.log
            accesslog/
            person-before.txt
            person-after.txt
            persons-writes.txt
          max-examples: 10
