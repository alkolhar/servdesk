name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Runs compile, unit + Testcontainers/PostgreSQL integration tests, ArchUnit rules, the Angular
      # production build (prepare-package), Spotless format check and JaCoCo coverage reporting (all
      # wired into the verify phase — see pom.xml).
      # The Docker daemon Testcontainers needs is preinstalled on GitHub-hosted ubuntu runners.
      - name: Build and verify
        run: ./mvnw --batch-mode verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # Not a blocking gate yet: this is the first time SpotBugs runs against a JDK it was actually
      # built to support (the project's own machine used to author this pipeline is on a newer JDK
      # where SpotBugs's bundled ASM can't parse the platform's own class files — see pom.xml).
      # Remove continue-on-error once a real run here has been observed green.
      - name: Static analysis (SpotBugs)
        continue-on-error: true
        run: ./mvnw --batch-mode spotbugs:check

  # The Angular SPA's own checks (ADR-0003): lint and unit tests. Its production build runs inside
  # build-and-test's `./mvnw verify` (bound to prepare-package), so a build break fails there.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          # same Node as frontend.node.version in pom.xml
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # both regenerate the TypeScript models from servdesk-api.yaml first (pre-scripts)
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Build container image
        run: docker build -t servdesk:ci .

  # Verifies the running app never drifts from static/openapi/servdesk-api.yaml. Runs as its own CI
  # job (not part of `./mvnw verify`) using each tool's own officially-supported integration —
  # schemathesis/action for Schemathesis, and Redocly CLI via npx (Node is preinstalled on
  # GitHub-hosted ubuntu runners, same basis as Docker in build-and-test above) — rather than
  # shelling out to either from inside a JUnit test.
  contract-tests:
    runs-on: ubuntu-latest
    # Most failure surface of any job here (a backgrounded app process, a polling readiness loop, two
    # external tools) — bound it rather than falling back to the platform default.
    timeout-minutes: 15
    services:
      postgres:
        # Same image as docker-compose.yml and TestcontainersConfiguration.POSTGRES_IMAGE — keep all
        # three in step. 17 because Flowable 8's CI covers 14-17 (ADR-0006); move to 18 deliberately,
        # once Flowable covers it. Bumped by hand: Dependabot's github-actions ecosystem only updates
        # `uses:` references, not `services:` images (#60 amendment).
        image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: servdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d servdesk"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build the jar
        run: ./mvnw --batch-mode package -DskipTests

      # stdout/stderr go to a file rather than the step's console pipe, which closes when this step
      # ends — everything the app logged for the rest of the job used to be lost, so there was no
      # file for anything to read (#61).
      - name: Start the app against the PostgreSQL service container
        run: |
          java -jar target/*.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/servdesk \
            --spring.datasource.username=postgres \
            --spring.datasource.password=root \
            > "$GITHUB_WORKSPACE/app.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/setup && exit 0
            sleep 2
          done
          echo "App never became ready" >&2
          exit 1

      # Fixture-only credentials for this CI run's disposable PostgreSQL service container — not a
      # real secret, same admin/admin123 pattern the integration tests already bootstrap with.
      - name: Bootstrap the first agent
        run: |
          curl -sf -X POST http://localhost:8080/api/setup -H "Content-Type: application/json" \
            -d '{"name":"Administrator","email":"admin@example.com","username":"admin","password":"admin123"}'

      # Creates the rows every {id} in schemathesis.toml is pinned to, and exports their ids to
      # $GITHUB_ENV. Without this the fuzzer draws ids across the full int64 range and 28 operations
      # spend the whole run on 404s, never once exercising a success response (#69).
      - name: Seed the fixture graph the contract tests need
        run: .github/scripts/seed-contract-fixtures.sh
        env:
          BASE_URL: http://localhost:8080
          AUTH: admin:admin123

      - name: Lint and bundle the OpenAPI contract (Redocly CLI)
        run: |
          npx --yes @redocly/cli@2.39.0 lint
          npx --yes @redocly/cli@2.39.0 bundle main -o /tmp/bundled-openapi.yaml

      - name: Verify the running app matches the contract (Schemathesis)
        uses: schemathesis/action@v3
        with:
          schema: /tmp/bundled-openapi.yaml
          base-url: http://localhost:8080
          checks: not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance
          # base64 of admin:admin123 — the fixture credentials bootstrapped above
          authorization: "Basic YWRtaW46YWRtaW4xMjM="
          # Pins every {id} to a row the step above created, via ${SERVDESK_*} interpolation. An
          # unset variable is a hard error, so broken wiring fails the run rather than silently
          # reverting to 404s.
          config-file: schemathesis.toml
          # Deliberately cut to the minimum while feature work takes priority (2026-09-29): this job
          # was the long pole on every PR (7-10 min vs ~2 for build-and-test). Measured on #69's
          # branch with the fixture pinning in place:
          #
          #   max-examples  step     links covered  mismatched ops  requests
          #   10            119.0s   3              19              3703
          #   50            237.7s   14             16              6817
          #   100           400.9s   18             16              10710
          #
          # The cost is stateful link depth (18 -> 3 covered links); every operation is still
          # exercised and every response still checked. 50 is the step back up if link depth starts
          # mattering, 100 the ceiling under the 600s step budget — re-measure before going past it.
          #
          # The missing_test_data warning will NOT clear for the 12 DELETE operations at any value,
          # by design: each is pinned to one sacrificial row, so the first call answers 204 and
          # every later one 404. Judge this number by the non-DELETE operations only.
          max-examples: 10
          # At max-examples 10, Hypothesis's filter_too_much health check fires on ~1 run in 10 —
          # a random red PR with no contract break behind it. It reports generation efficiency
          # (negative-mode rejection sampling), never an API defect: #68 reproduced it with a stub
          # server that answers everything 201. Suppressing all four health checks is #64's
          # decision; the cost is fewer negative examples on the affected operation, nothing more.
          args: --suppress-health-check=all

      # if: always() because a failed run is exactly when the log is wanted — #56's NPE was found by
      # reading one of these by hand, and the job was green at the time.
      - name: Upload the app log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: contract-tests-app-log
          path: app.log
          if-no-files-found: error

      # Uploaded first, so the evidence survives even when this check is what fails.
      #
      # A silently-broken redirect would leave #65's future ERROR gate reading a file that ends at
      # boot and passing vacuously — the hollow green this whole map exists to remove. So the
      # capture checks itself rather than trusting that it still works.
      #
      # The check is deliberately marker-free: it asserts that output kept arriving *after* Boot's
      # "Started ServdeskApplication" line, which is what a closed pipe would truncate. An earlier
      # version asserted on a specific DEBUG marker instead and failed — not because the capture was
      # broken (4478 lines were captured) but because the marker never fires, which is its own bug
      # (#79). Tying this check to one log line made it a test of that line, not of the redirect.
      - name: Confirm the app log captured post-startup output
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/app.log"
          if [ ! -s "$LOG" ]; then
            echo "app.log is missing or empty — the redirect is broken" >&2
            exit 1
          fi
          total=$(wc -l < "$LOG")
          boot=$(grep -n "Started ServdeskApplication" "$LOG" | head -1 | cut -d: -f1)
          if [ -z "$boot" ]; then
            echo "app.log never recorded startup completing — the app did not boot cleanly" >&2
            tail -n 20 "$LOG" >&2
            exit 1
          fi
          after=$((total - boot))
          echo "app.log: $total lines, startup completed at line $boot, $after lines after it"
          if [ "$after" -lt 1 ]; then
            echo "Nothing was captured after startup: output stopped reaching the file, which is" >&2
            echo "exactly the failure this job used to have silently." >&2
            exit 1
          fi
          echo "ERROR/WARN lines in the captured log (informational — #65 decides the gate):"
          grep -cE " (ERROR|WARN) " "$LOG" || true
